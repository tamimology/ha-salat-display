wallpanel:
  enabled: true
  enabled_on_views:
    - salat-times
  hide_toolbar: true
  hide_sidebar: true
  fullscreen: true
  idle_time: 0
views:
  - title: Salat Times
    path: salat-times
    icon: mdi:mosque
    visible:
      - user: !!!!!!REPLACE BY SALAT-TIMES-USER-ID!!!!!!!
    type: panel
    layout:
      width: 700
      max_cols: 2
    subview: false
    badges: []
    cards:
      - type: custom:vertical-stack-in-card
        cards:
          - square: false
            columns: 2
            type: grid
            cards:
              - type: custom:vertical-stack-in-card
                cards:
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: custom:template-entity-row
                        name: توقيت صيفي
                        secondary: Day Light Saving
                        icon: " "
                        state: " "
                        card_mod:
                          style: |
                            :host {
                              font-size: 14px;
                              text-align: center;
                              {% if is_state('binary_sensor.dst', 'on') %}
                                --paper-item-icon-color: #fdd835;
                                --card-mod-icon-color: #fdd835;
                                color: #fdd835;
                              {% else %}
                                --paper-item-icon-color: #808080;
                                --card-mod-icon-color: #808080;
                                color: #808080;
                              {% endif %}
                            .card-content {
                              text-align: center;
                              justify-content: center;
                            }
                  - type: custom:simple-clock-card
                    time_zone: Australia/Melbourne
                    use_military: true
                    hide_seconds: false
                    bold_clock: false
                    font_size: 3rem
                    paddingLeft_size: 32px
                    paddingRight_size: 32px
                    paddingTop_size: 8px
                    paddingBottom_size: 8px
                  - type: custom:clock-card
                    size: 250
                    font_size: 20
                    disable_seconds: false
                    caption: null
                    display_date: DDD DD MMM, YYYY
                    theme:
                      background: black
                      hands: orange
                      numbers: white
                      border: grey
                    wp_style:
                      margin-top: 10px
                      width: 400px
                      grid-row: 1
                      grid-column: 1
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: custom:template-entity-row
                        name: |
                          {{states.sensor.hijri_weekday.state}}
                          {{states.sensor.hijri_day.state}}
                          {{states.sensor.hijri_month.state}} 
                          {{states.sensor.hijri_year.state}}
                          هـ
                        card_mod:
                          style: |
                            :host {
                              display: flex;
                              flex-direction: row-reverse;
                              justify-content: center;
                              text-align: center;
                              font-size: 20px;
                              direction: rtl;
                            }
              - type: custom:vertical-stack-in-card
                cards:
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: entities
                        entities:
                          - entity: sensor.fajr_dst
                            type: custom:multiple-entity-row
                            name: الفجر
                            secondary_info: Fajr
                            format: time
                            tap_action:
                              action: none
                            hold_action:
                              action: none
                            double_tap_action:
                              action: none
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.fajr_dst")| as_timestamp > now().timestamp() %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.sunrise_dst
                            type: custom:multiple-entity-row
                            name: الشروق
                            secondary_info: Sunrise
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.sunrise_dst")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.fajr_dst")| as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - type: conditional
                            conditions:
                              - condition: state
                                entity: sensor.hijri_weekday
                                state_not: الجمعة
                            row:
                              entity: sensor.dhuhr_dst
                              type: custom:multiple-entity-row
                              name: الظهر
                              secondary_info: Dhuhur
                              format: time
                              card_mod:
                                style: |
                                  :host {
                                    font-size: 22px;
                                    text-align: left
                                    {% if states("sensor.dhuhr_dst")| as_timestamp > now().timestamp() and now().timestamp() >  states("sensor.sunrise_dst")| as_timestamp %}
                                      --paper-item-icon-color: #4caf50;
                                      --card-mod-icon-color: #4caf50;
                                      color: #4caf50;
                                    {% else %}
                                      --paper-item-icon-color: #808080;
                                      --card-mod-icon-color: #808080;
                                      color: #808080;
                                    {% endif %}
                                  }
                          - type: conditional
                            conditions:
                              - condition: state
                                entity: sensor.hijri_weekday
                                state: الجمعة
                            row:
                              entity: sensor.dhuhr_dst
                              type: custom:multiple-entity-row
                              name: الجمعة
                              secondary_info: Juma'a
                              format: time
                              card_mod:
                                style: |
                                  :host {
                                    font-size: 22px;
                                    text-align: left
                                    {% if states("sensor.dhuhr_dst")| as_timestamp > now().timestamp() and now().timestamp() >  states("sensor.sunrise_dst")| as_timestamp %}
                                      --paper-item-icon-color: #4caf50;
                                      --card-mod-icon-color: #4caf50;
                                      color: #4caf50;
                                    {% else %}
                                      --paper-item-icon-color: #808080;
                                      --card-mod-icon-color: #808080;
                                      color: #808080;
                                    {% endif %}
                                  }
                          - entity: sensor.asr_dst
                            type: custom:multiple-entity-row
                            name: العصر
                            secondary_info: Asr
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.asr_dst")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.dhuhr_dst")| as_timestamp  %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.maghreb_dst
                            type: custom:multiple-entity-row
                            name: المغرب
                            secondary_info: Maghrib
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.maghreb_dst") | as_timestamp > now().timestamp() and now().timestamp() > states("sensor.asr_dst") | as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.isha_dst
                            type: custom:multiple-entity-row
                            name: العشاء
                            secondary_info: Isha
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.isha_dst")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.maghreb_dst")| as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.midnight_dst
                            type: custom:multiple-entity-row
                            name: منتصف الليل
                            secondary_info: Midnight
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.midnight_dst")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.isha_dst")| as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
          - type: custom:vertical-stack-in-card
            cards:
              - type: entities
                show_header_toggle: false
                state_color: false
                entities:
                  - type: custom:template-entity-row
                    name: الزمن المتبقي للصلاة
                    secondary: Next Prayer ETA
                    state: |
                      {% if states("sensor.next_prayer_eta")=="unavailable" %}
                        TBC
                      {% else %}
                        {{states("sensor.next_prayer_eta")}}
                      {% endif %}
                    tap_action: none
                    state_color: false
                    card_mod:
                      style: |
                        :host {
                          text-align: left;
                          font-size: 20px;
                          --paper-item-icon-color: #ff9800;
                          --card-mod-icon-color: #ff9800;
                          color: #ff9800;
                        }
              - type: custom:vertical-stack-in-card
                cards:
                  - type: markdown
                    content: |
                      {{ state_attr("sensor.daily_hadith", "arabic") }}
                    text_only: true
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                        }
                        ha-markdown {
                          text-align: right !important;
                          direction: rtl !important;
                          font-size: 17px !important;
                          color: rgba(152, 255, 240, 1) !important;
                          line-height: normal !important;
                        }
