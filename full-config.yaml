wallpanel:
  enabled: true
  enabled_on_views:
    - salat-times
  hide_toolbar: true
  hide_sidebar: true
  fullscreen: true
  idle_time: 0
views:
  - title: Salat Times
    path: salat-times
    icon: mdi:mosque
    visible:
      - user: !!!!!!REPLACE BY SALAT-TIMES-USER-ID!!!!!!!
    type: panel
    layout:
      width: 700
      max_cols: 2
    subview: false
    badges: []
    cards:
      - type: custom:vertical-stack-in-card
        cards:
          - square: false
            columns: 2
            type: grid
            cards:
              - type: custom:vertical-stack-in-card
                cards:
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: custom:template-entity-row
                        name: توقيت صيفي
                        secondary: Day Light Saving
                        icon: " "
                        state: " "
                        card_mod:
                          style: |
                            :host {
                              font-size: 14px;
                              text-align: center;
                              {% if is_state('binary_sensor.dst', 'on') %}
                                --paper-item-icon-color: #fdd835;
                                --card-mod-icon-color: #fdd835;
                                color: #fdd835;
                              {% else %}
                                --paper-item-icon-color: #808080;
                                --card-mod-icon-color: #808080;
                                color: #808080;
                              {% endif %}
                            .card-content {
                              text-align: center;
                              justify-content: center;
                            }
                  - type: clock
                    clock_style: digital
                    clock_size: large
                    time_format: '24'
                    show_seconds: true
                    no_background: true
                    face_style: markers
                    time_zone: Australia/Melbourne
                  - type: custom:clock-card
                    size: 250
                    font_size: 20
                    disable_seconds: false
                    caption: null
                    display_date: DDD DD MMM, YYYY
                    theme:
                      background: black
                      hands: orange
                      numbers: white
                      border: grey
                    wp_style:
                      margin-top: 10px
                      width: 400px
                      grid-row: 1
                      grid-column: 1
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: custom:template-entity-row
                        name: |
                          {{ state_attr('sensor.hijri_date', 'weekday')['ar']}}
                          {{ state_attr('sensor.hijri_date', 'day')}}
                          {{ state_attr('sensor.hijri_date', 'month')['ar']}}
                          {{ state_attr('sensor.hijri_date', 'year')}}
                          هـ
                        card_mod:
                          style: |
                            :host {
                              display: flex;
                              flex-direction: row-reverse;
                              justify-content: center;
                              text-align: center;
                              font-size: 20px;
                              direction: rtl;
                            }
              - type: custom:vertical-stack-in-card
                cards:
                  - square: false
                    columns: 1
                    type: grid
                    cards:
                      - type: entities
                        entities:
                          - entity: sensor.islamic_prayer_times_fajr_prayer
                            type: custom:multiple-entity-row
                            name: الفجر
                            secondary_info: Fajr
                            format: time
                            tap_action:
                              action: none
                            hold_action:
                              action: none
                            double_tap_action:
                              action: none
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_fajr_prayer")| as_timestamp > now().timestamp() %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.islamic_prayer_times_sunrise_time
                            type: custom:multiple-entity-row
                            name: الشروق
                            secondary_info: Sunrise
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_sunrise_time")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.islamic_prayer_times_fajr_prayer")| as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - type: conditional
                            conditions:
                              - condition: state
                                entity: sensor.hijri_weekday
                                state_not: الجمعة
                            row:
                              entity: sensor.islamic_prayer_times_dhuhr_prayer
                              type: custom:multiple-entity-row
                              name: الظهر
                              secondary_info: Dhuhur
                              format: time
                              card_mod:
                                style: |
                                  :host {
                                    font-size: 22px;
                                    text-align: left
                                    {% if states("sensor.islamic_prayer_times_dhuhr_prayer")| as_timestamp > now().timestamp() and now().timestamp() >  states("sensor.islamic_prayer_times_sunrise_time")| as_timestamp %}
                                      --paper-item-icon-color: #4caf50;
                                      --card-mod-icon-color: #4caf50;
                                      color: #4caf50;
                                    {% else %}
                                      --paper-item-icon-color: #808080;
                                      --card-mod-icon-color: #808080;
                                      color: #808080;
                                    {% endif %}
                                  }
                          - type: conditional
                            conditions:
                              - condition: state
                                entity: sensor.hijri_weekday
                                state: الجمعة
                            row:
                              entity: sensor.islamic_prayer_times_dhuhr_prayer
                              type: custom:multiple-entity-row
                              name: الجمعة
                              secondary_info: Juma'a
                              format: time
                              card_mod:
                                style: |
                                  :host {
                                    font-size: 22px;
                                    text-align: left
                                    {% if states("sensor.islamic_prayer_times_dhuhr_prayer")| as_timestamp > now().timestamp() and now().timestamp() >  states("sensor.islamic_prayer_times_sunrise_time")| as_timestamp %}
                                      --paper-item-icon-color: #4caf50;
                                      --card-mod-icon-color: #4caf50;
                                      color: #4caf50;
                                    {% else %}
                                      --paper-item-icon-color: #808080;
                                      --card-mod-icon-color: #808080;
                                      color: #808080;
                                    {% endif %}
                                  }
                          - entity: sensor.islamic_prayer_times_asr_prayer
                            type: custom:multiple-entity-row
                            name: العصر
                            secondary_info: Asr
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_asr_prayer")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.islamic_prayer_times_dhuhr_prayer")| as_timestamp  %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.islamic_prayer_times_maghrib_prayer
                            type: custom:multiple-entity-row
                            name: المغرب
                            secondary_info: Maghrib
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_maghrib_prayer") | as_timestamp + 360 > now().timestamp() and now().timestamp() > states("sensor.islamic_prayer_times_asr_prayer") | as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.islamic_prayer_times_isha_prayer
                            type: custom:multiple-entity-row
                            name: العشاء
                            secondary_info: Isha
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_isha_prayer")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.islamic_prayer_times_maghrib_prayer")| as_timestamp + 360 %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
                          - entity: sensor.islamic_prayer_times_midnight_time
                            type: custom:multiple-entity-row
                            name: منتصف الليل
                            secondary_info: Midnight
                            format: time
                            card_mod:
                              style: |
                                :host {
                                  font-size: 22px;
                                  text-align: left
                                  {% if states("sensor.islamic_prayer_times_midnight_time")| as_timestamp > now().timestamp() and now().timestamp() > states("sensor.islamic_prayer_times_isha_prayer")| as_timestamp %}
                                    --paper-item-icon-color: #4caf50;
                                    --card-mod-icon-color: #4caf50;
                                    color: #4caf50;
                                  {% else %}
                                    --paper-item-icon-color: #808080;
                                    --card-mod-icon-color: #808080;
                                    color: #808080;
                                  {% endif %}
                                }
          - type: custom:vertical-stack-in-card
            cards:
              - square: false
                columns: 1
                type: grid
                cards:
                  - type: custom:template-entity-row
                    name: >
                      {% if
                      state_attr('sensor.next_prayer_eta','next_prayer_ar')=='الشروق'
                      %}
                        {{state_attr('sensor.next_prayer_eta','next_prayer_ar')}} بعد
                      {% else %}
                        صلاة {{state_attr('sensor.next_prayer_eta','next_prayer_ar')}} بعد
                      {% endif %}
                    secondary: >
                      {% if
                      state_attr('sensor.next_prayer_eta','next_prayer_en')=='Sunrise'
                      %}
                        {{state_attr('sensor.next_prayer_eta','next_prayer_en')}} in
                      {% else %}
                        {{state_attr('sensor.next_prayer_eta','next_prayer_en')}} prayer
                      in {% endif %}
                    state: |
                      {% if states("sensor.next_prayer_eta")=="unavailable" %}
                        TBC
                      {% else %}
                        {{state_attr('sensor.next_prayer_eta','next_eta')}}
                      {% endif %}
                    tap_action: none
                    card_mod:
                      style: |
                        :host {
                          display: flex !important;
                          justify-content: center !important;
                          align-items: center !important;
                          text-align: center !important;
                          font-size: 20px;
                          --paper-item-icon-color: #ff9800;
                          --card-mod-icon-color: #ff9800;
                          color: #ff9800;
                        }
                        .info {
                          flex: 0 1 auto !important;
                          margin-left: 16px !important;
                          margin-right: 16px !important;
                        }
                        .state {
                          margin-left: 0px !important;
                        }
              - type: custom:vertical-stack-in-card
                cards:
                  - type: markdown
                    content: |
                      {{ state_attr("sensor.daily_hadith", "arabic") }}
                    text_only: true
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                        }
                        ha-markdown {
                          text-align: right !important;
                          direction: rtl !important;
                          font-size: 17px !important;
                          color: rgba(152, 255, 240, 1) !important;
                          line-height: normal !important;
                        }
